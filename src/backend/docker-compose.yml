services:

  redis-primary:
    image: redis:8-alpine
    container_name: redis-primary
    restart: unless-stopped

    command:
      - redis-server
      - /etc/redis/redis.conf

    volumes:
      - ./redis-config/redis-master.conf:/etc/redis/redis.conf:ro
      - redis-primary-data:/data

    ports:
      - "6379:6379"

    networks:
      - redis-net

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "redispassword",
          "PING"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  redis-replica-1:
    image: redis:8-alpine
    container_name: redis-replica-1
    restart: unless-stopped

    command:
      - redis-server
      - /etc/redis/redis.conf

    volumes:
      - ./redis-config/redis-replica.conf:/etc/redis/redis.conf:ro
      - redis-replica-1-data:/data

    ports:
      - "6380:6379"

    networks:
      - redis-net

    depends_on:
      redis-primary:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "redispassword",
          "PING"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  redis-replica-2:
    image: redis:8-alpine
    container_name: redis-replica-2
    restart: unless-stopped

    command:
      - redis-server
      - /etc/redis/redis.conf

    volumes:
      - ./redis-config/redis-replica.conf:/etc/redis/redis.conf:ro
      - redis-replica-2-data:/data

    ports:
      - "6381:6379"

    networks:
      - redis-net

    depends_on:
      redis-primary:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "redispassword",
          "PING"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  sentinel-1:
    image: redis:8-alpine
    container_name: sentinel-1
    restart: unless-stopped

    command:
      - sh
      - -c
      - |
        set -e

        if [ ! -f /data/sentinel.conf ]; then
          until getent hosts redis-primary >/dev/null 2>&1; do
            sleep 1
          done

          PRIMARY_IP=$$(getent hosts redis-primary | awk 'NR==1 {print $$1}')

          sed "s/REDIS_PRIMARY_IP/$$PRIMARY_IP/" \
            /config/sentinel.conf \
            > /data/sentinel.conf
        fi

        exec redis-sentinel /data/sentinel.conf

    volumes:
      - ./redis-config/sentinel.conf:/config/sentinel.conf:ro
      - sentinel-1-data:/data

    ports:
      - "26379:26379"

    networks:
      - redis-net

    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy


  sentinel-2:
    image: redis:8-alpine
    container_name: sentinel-2
    restart: unless-stopped

    command:
      - sh
      - -c
      - |
        set -e

        if [ ! -f /data/sentinel.conf ]; then
          until getent hosts redis-primary >/dev/null 2>&1; do
            sleep 1
          done

          PRIMARY_IP=$$(getent hosts redis-primary | awk 'NR==1 {print $$1}')

          sed "s/REDIS_PRIMARY_IP/$$PRIMARY_IP/" \
            /config/sentinel.conf \
            > /data/sentinel.conf
        fi

        exec redis-sentinel /data/sentinel.conf

    volumes:
      - ./redis-config/sentinel.conf:/config/sentinel.conf:ro
      - sentinel-2-data:/data

    ports:
      - "26380:26379"

    networks:
      - redis-net

    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy


  sentinel-3:
    image: redis:8-alpine
    container_name: sentinel-3
    restart: unless-stopped

    command:
      - sh
      - -c
      - |
        set -e

        if [ ! -f /data/sentinel.conf ]; then
          until getent hosts redis-primary >/dev/null 2>&1; do
            sleep 1
          done

          PRIMARY_IP=$$(getent hosts redis-primary | awk 'NR==1 {print $$1}')

          sed "s/REDIS_PRIMARY_IP/$$PRIMARY_IP/" \
            /config/sentinel.conf \
            > /data/sentinel.conf
        fi

        exec redis-sentinel /data/sentinel.conf

    volumes:
      - ./redis-config/sentinel.conf:/config/sentinel.conf:ro
      - sentinel-3-data:/data

    ports:
      - "26381:26379"

    networks:
      - redis-net

    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy


  node:
    image: node:26-alpine
    container_name: redis-node
    restart: "no"

    working_dir: /app

    volumes:
      - ./:/app

    environment:
      REDIS_PASSWORD: redispassword

    networks:
      - redis-net

    depends_on:
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started

    command:
      - sh
      - -c
      - |
        npm install
        node teste.js


networks:
  redis-net:
    driver: bridge


volumes:
  redis-primary-data:
  redis-replica-1-data:
  redis-replica-2-data:
  sentinel-1-data:
  sentinel-2-data:
  sentinel-3-data: