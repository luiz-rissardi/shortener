<form class="shorten-form" [formRoot]="this.urlForm">
    <div class="shorten-form-field">
        <label class="shorten-form-label" for="targetUrl">URL original</label>
        <div class="shorten-form-row">
            <div style="display: flex; flex-direction: column; width: 100%;">
                <input id="targetUrl" class="shorten-form-input" type="url" [formField]="this.urlForm.targetUrl"
                    placeholder="https://exemplo.com/pagina-com-endereco-muito-longo" autocomplete="off" />
                @if(
                this.urlForm.targetUrl().touched() &&
                this.urlForm.targetUrl().invalid()){
                <span class="input-invalid"> {{ this.urlForm.targetUrl().errors()[0].message }} </span>
                }
            </div>
            <button type="submit" class="shorten-btn">Encurtar</button>
        </div>
    </div>
</form>
